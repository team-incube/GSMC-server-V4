services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gsmc-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy  
  mysql:
    image: mysql:8.0
    container_name: gsmc-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${RDB_PASSWORD}
      MYSQL_DATABASE: ${RDB_SCHEMA}
      MYSQL_USER: ${RDB_USERNAME}
      MYSQL_PASSWORD: ${RDB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${RDB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


volumes:
  mysql_data:
