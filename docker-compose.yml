services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onboarding-backend
    ports:
      - "8080:8080"
    environment:
    depends_on:
      - mysql
      
    
  mysql:
    image: mysql:8.0
    container_name: gsmc-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: onboarding_db
      MYSQL_USER: onboarding_user
      MYSQL_PASSWORD: onboarding_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: