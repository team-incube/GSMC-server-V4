language: ko
tone: professional
emoji: false
minSeverity: minor
maxInlineComments: 25

exclude:
  - 'gradlew'
  - 'gradlew.bat'
  - 'gradle/wrapper/**'
  - '**/.gradle/**'
  - '**/build/**'
  - '**/generated/**'
  - '**/kapt*/**'
  - '**/ksp*/**'

sandrone:
  autoReview: true
  autoReviewOnPush: false
  summaryPlacement: new-comment
  threadReply: true
  emoji: false
  maxReviewBatches: 4
