spring:
  application:
    name: GSMC-server-v4
  graphql:
    graphiql:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  pattern:
    level: "%5p [userId=%X{userId:-anonymous}]"

sse:
  heartbeat-interval: 30000
  emitter-timeout: 1800000
  max-connections-per-user: 5

sdk:
  logging:
    enabled: true
    not-logging-urls:
      - "/graphiql/**"
      - "/graphql/**"
      - "/api/alerts/stream"
  response:
    enabled: false
  swagger:
    enabled: false
  exception:
    enabled: false

security:
  oauth:
    client-id: ${OAUTH_CLIENT_ID}
    client-secret: ${OAUTH_CLIENT_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600
    refresh-token-expiry: 2592000

datagsm:
  openapi:
    base-url: ${DATAGSM_OPENAPI_BASE_URL:https://openapi.datagsm.kr}
    api-key: ${DATAGSM_OPENAPI_KEY}
    connect-timeout: ${DATAGSM_OPENAPI_CONNECT_TIMEOUT:3s}
    read-timeout: ${DATAGSM_OPENAPI_READ_TIMEOUT:5s}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}

discord:
  webhook:
    graphql-latency-url: ${DISCORD_GRAPHQL_LATENCY_WEBHOOK_URL:}
