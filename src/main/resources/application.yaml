spring:
  application:
    name: GSMC-server-v4
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

sdk:
  logging:
    enabled: true
    not-logging-urls: []
  response:
    enabled: false
  swagger:
    enabled: false
  exception:
    enabled: false

oauth:
  client-id: ${OAUTH_CLIENT_ID}
  client-secret: ${OAUTH_CLIENT_SECRET}
  redirect-uri: ${OAUTH_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600
  refresh-token-expiry: 2592000
